# Extension Proxy Configuration for Coston2
# Copy to fce-extension-scaffold/config/proxy/extension_proxy.coston2.docker.toml

[extension]
# Extension type: "typescript" | "go" | "python"
type = "typescript"
# Path relative to extension_proxy binary (inside Docker: /app/extension)
path = "/app/extension"

[proxy]
# External port (what ngrok tunnels to)
port = 6674
# Logging level: "debug" | "info" | "warn" | "error"
log_level = "info"

[db]
# Indexer database configuration
# Host and port are public, username/password require Flare support
host = "34.38.42.208"
port = 3306
database = "indexer"
username = "YOUR_USERNAME_FROM_FLARE"
password = "YOUR_PASSWORD_FROM_FLARE"

# Connection pool settings
max_open_conns = 10
max_idle_conns = 5
conn_max_lifetime = "30m"

[redis]
# Redis configuration (used by scaffold)
host = "redis"
port = 6379
db = 0
password = ""

[chain]
# Coston2 RPC endpoint
rpc_url = "https://coston2-api.flare.network/ext/C/rpc"
chain_id = 114

[tee]
# TEE configuration
# In SIMULATED_TEE mode, these are managed by tee-node
simulated = true
